workflows:
  ios-release:
    name: iOS Release Build
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: Flutter pub get
        script: flutter pub get
      - name: Install CocoaPods
        script: |
          find . -name "Podfile" -execdir pod install \;
      - name: Build iOS Release (unsigned)
        script: |
          flutter build ipa --release --no-codesign --export-method development
      - name: Verify build mode is release
        script: |
          echo "=== Verificando modo de compilación ==="
          PLIST="build/ios/archive/Runner.xcarchive/Products/Applications/Runner.app/Info.plist"
          if [ -f "$PLIST" ]; then
            /usr/libexec/PlistBuddy -c "Print :FLUTTER_BUILD_MODE" "$PLIST" || echo "FLUTTER_BUILD_MODE no encontrado"
          fi
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log